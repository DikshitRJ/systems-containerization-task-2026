# Rate Limiting Configuration
# Limits client requests based on IP address: 10MB memory zone, 200 requests per second
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;

# Upstream Load Balancing Pool for Backend Replicas
upstream backend_cluster {
    # Round-robin load balancing across all backend replica instances
    server backend:4000;
    keepalive 32;
}

# HTTP Server: Redirect all traffic to HTTPS
server {
    listen 80;
    server_name localhost;

    # Automatically redirect all incoming HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server: Terminate SSL, load balance, rate limit, and proxy traffic
server {
    listen 443 ssl;
    server_name localhost;

    # SSL Certificate and Key Configuration
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Secure SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend API: Reverse proxy with upstream load balancing and rate limiting
    location /api/ {
        # Rate limiting: burst up to 500 requests to handle traffic spikes safely
        limit_req zone=api_limit burst=500 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend Client: Static SPA routing
    location / {
        set $frontend_service http://frontend:80;
        proxy_pass $frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
